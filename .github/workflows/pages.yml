# Publishes only the privacy policy (and the stylesheet it uses) to GitHub Pages.
# The OKR dashboard itself is not published here.
# Privacy policy: https://heberjones26.github.io/preptip-extension/privacy.html
name: Deploy privacy policy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dashboard/privacy.html", "dashboard/dashboard.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage privacy page
        run: |
          mkdir _site
          cp dashboard/privacy.html dashboard/dashboard.css _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
